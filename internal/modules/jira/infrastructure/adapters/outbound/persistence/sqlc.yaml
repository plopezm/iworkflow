version: "2"
sql:
  - engine: "sqlite"
    # Schema is the shared goose migration folder (the `-- +goose Up` section of each file).
    schema: "../../../../../../core/db/migrations"
    queries: "queries"
    gen:
      go:
        package: "gen"
        out: "gen"
        overrides:
          # Timestamps are stored as "YYYY-MM-DD HH:MM:SS[.f]" text, the format the Rust (Diesel)
          # version wrote, and both versions read each other's rows. The adapter formats and parses
          # them itself, so the driver never converts them.
          - column: "jira_connection.updated_at"
            go_type: "string"
          - column: "jira_connection.last_sync_at"
            go_type:
              type: "string"
              pointer: true
          - column: "jira_issues.jira_updated_at"
            go_type: "string"
          - column: "jira_issues.synced_at"
            go_type: "string"
          - column: "jira_lanes.created_at"
            go_type: "string"
