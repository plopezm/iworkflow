appId: dev.iworkflow.desktop
productName: iworkflow
artifactName: iworkflow-${version}-${os}-${arch}.${ext}
directories:
  output: ../dist/electron
files:
  - package.json
  - src/**
  - build/icon.png
# The packaged server (binary + site/) is copied by scripts/electron.sh into resources/server.
# It lives outside the asar archive so the binary stays executable.
extraResources:
  - from: resources/server
    to: server
linux:
  target: [AppImage]
  category: Development
  icon: build/icon.png
win:
  target: [nsis]
  icon: build/icon.png
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
