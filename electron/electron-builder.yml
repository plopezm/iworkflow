appId: dev.iworkflow.desktop
productName: iworkflow
artifactName: iworkflow-${version}-${os}-${arch}.${ext}
# Where electron-updater looks for latest*.yml; release.yml uploads those files with the installers.
publish:
  provider: github
  owner: plopezm
  repo: iworkflow
directories:
  output: ../dist/electron
files:
  - package.json
  - src/**
  - build/icon.png
# The packaged server (binary + site/) is copied by `make electron-build` into resources/server.
# It lives outside the asar archive so the binary stays executable.
extraResources:
  - from: resources/server
    to: server
linux:
  target: [AppImage]
  category: Development
  icon: build/icon.png
mac:
  target: [dmg]
  category: public.app-category.developer-tools
  icon: build/icon.png
  # No Apple certificate: sign ad hoc ("-"). Apple Silicon refuses an app whose signature
  # became invalid after adding the server to its resources.
  identity: "-"
  hardenedRuntime: false
win:
  target: [nsis]
  icon: build/icon.png
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
