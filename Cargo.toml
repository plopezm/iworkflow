[package]
name = "pi-workflow"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
leptos = { version = "0.8.21" }
leptos_router = { version = "0.8" }
leptos_meta = { version = "0.8" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde", "js"] }
chrono = { version = "0.4", features = ["serde"] }

# ssr
axum = { version = "0.8", optional = true }
leptos_axum = { version = "0.8", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "sync", "fs", "time"], optional = true }
tokio-stream = { version = "0.1", features = ["sync"], optional = true }
futures = { version = "0.3", optional = true }
async-trait = { version = "0.1", optional = true }
diesel = { version = "2.3", features = ["sqlite", "chrono", "returning_clauses_for_sqlite_3_35"], optional = true }
diesel-async = { version = "0.9", features = ["sqlite", "deadpool", "async-connection-wrapper", "migrations"], optional = true }
diesel_migrations = { version = "2.3", features = ["sqlite"], optional = true }
libsqlite3-sys = { version = ">=0.17.2, <0.39.0", features = ["bundled"], optional = true }
dotenvy = { version = "0.15", optional = true }
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }

# hydrate
console_error_panic_hook = { version = "0.1", optional = true }
wasm-bindgen = { version = "0.2", optional = true }
web-sys = { version = "0.3", features = ["Event", "EventSource", "MessageEvent", "Window"], optional = true }

[dev-dependencies]
mockall = "0.15"
tempfile = "3"

[features]
hydrate = ["leptos/hydrate", "dep:console_error_panic_hook", "dep:wasm-bindgen", "dep:web-sys"]
ssr = [
    "dep:axum",
    "dep:tokio",
    "dep:tokio-stream",
    "dep:futures",
    "dep:leptos_axum",
    "dep:async-trait",
    "dep:diesel",
    "dep:diesel-async",
    "dep:diesel_migrations",
    "dep:libsqlite3-sys",
    "dep:dotenvy",
    "dep:tracing",
    "dep:tracing-subscriber",
    "leptos/ssr",
    "leptos_meta/ssr",
    "leptos_router/ssr",
]

[profile.wasm-release]
inherits = "release"
opt-level = 'z'
lto = true
codegen-units = 1
panic = "abort"

[package.metadata.leptos]
output-name = "pi-workflow"
site-root = "target/site"
site-pkg-dir = "pkg"
style-file = "style/main.css"
assets-dir = "public"
site-addr = "127.0.0.1:3000"
reload-port = 3001
browserquery = "defaults"
env = "DEV"
bin-features = ["ssr"]
bin-default-features = false
lib-features = ["hydrate"]
lib-default-features = false
lib-profile-release = "wasm-release"

[[test]]
name = "workspace_repository_adapter_test"
path = "tests/modules/workspaces/workspace_repository_adapter_test.rs"
required-features = ["ssr"]

[[test]]
name = "git_cli_repository_adapter_test"
path = "tests/modules/workspaces/git_cli_repository_adapter_test.rs"
required-features = ["ssr"]

[[test]]
name = "git_cli_worktree_adapter_test"
path = "tests/modules/tasks/git_cli_worktree_adapter_test.rs"
required-features = ["ssr"]

[[test]]
name = "task_repository_adapter_test"
path = "tests/modules/tasks/task_repository_adapter_test.rs"
required-features = ["ssr"]

[[test]]
name = "gentle_shell_runtime_adapter_test"
path = "tests/modules/tasks/gentle_shell_runtime_adapter_test.rs"
required-features = ["ssr"]
