[package]
name = "iworkflow"
version = "0.13.3"
edition = "2024"
license-file = "LICENSE"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
leptos = { version = "0.8.21", features = ["multipart"] }
leptos_router = { version = "0.8" }
leptos_meta = { version = "0.8" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde", "js"] }
chrono = { version = "0.4", features = ["serde"] }

# ssr
axum = { version = "0.8", features = ["ws"], optional = true }
leptos_axum = { version = "0.8", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "sync", "fs", "time", "signal"], optional = true }
tokio-stream = { version = "0.1", features = ["sync"], optional = true }
futures = { version = "0.3", optional = true }
multer = { version = "3.1", optional = true }
async-trait = { version = "0.1", optional = true }
base64 = { version = "0.22", optional = true }
diesel = { version = "2.3", features = ["sqlite", "chrono", "returning_clauses_for_sqlite_3_35"], optional = true }
diesel-async = { version = "0.9", features = ["sqlite", "deadpool", "async-connection-wrapper", "migrations"], optional = true }
diesel_migrations = { version = "2.3", features = ["sqlite"], optional = true }
libsqlite3-sys = { version = ">=0.17.2, <0.39.0", features = ["bundled"], optional = true }
dotenvy = { version = "0.15", optional = true }
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }
portable-pty = { version = "0.9", optional = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots"], optional = true }

# hydrate
console_error_panic_hook = { version = "0.1", optional = true }
wasm-bindgen = { version = "0.2", optional = true }
js-sys = { version = "0.3", optional = true }
web-sys = { version = "0.3", features = ["AddEventListenerOptions", "Blob", "ClipboardEvent", "DataTransfer", "Document", "DomRect", "Event", "EventSource", "EventTarget", "File", "FileList", "FileReader", "HtmlInputElement", "MessageEvent", "Notification", "NotificationOptions", "NotificationPermission", "Window"], optional = true }
pulldown-cmark = { version = "0.13.4", default-features = false, features = ["html"] }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.28", default-features = false, features = ["signal", "process"], optional = true }

[dev-dependencies]
any_spawner = { version = "0.3", features = ["tokio"] }
mockall = "0.15"
tempfile = "3"
tokio = { version = "1", features = ["test-util", "macros", "rt"] }

[features]
hydrate = ["leptos/hydrate", "dep:console_error_panic_hook", "dep:wasm-bindgen", "dep:web-sys", "dep:js-sys"]
ssr = [
    "dep:axum",
    "dep:tokio",
    "dep:tokio-stream",
    "dep:futures",
    "dep:multer",
    "dep:leptos_axum",
    "dep:async-trait",
    "dep:base64",
    "dep:diesel",
    "dep:diesel-async",
    "dep:diesel_migrations",
    "dep:libsqlite3-sys",
    "dep:dotenvy",
    "dep:tracing",
    "dep:tracing-subscriber",
    "dep:portable-pty",
    "dep:reqwest",
    "dep:nix",
    "leptos/ssr",
    "leptos_meta/ssr",
    "leptos_router/ssr",
]

[profile.wasm-release]
inherits = "release"
opt-level = 'z'
lto = true
codegen-units = 1
panic = "abort"

[package.metadata.leptos]
output-name = "iworkflow"
site-root = "target/site"
site-pkg-dir = "pkg"
tailwind-input-file = "style/tailwind.css"
assets-dir = "public"
site-addr = "127.0.0.1:3000"
reload-port = 3001
browserquery = "defaults"
bin-features = ["ssr"]
bin-default-features = false
lib-features = ["hydrate"]
lib-default-features = false
lib-profile-release = "wasm-release"

