name: Build binaries

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  # Pinned to the versions that produced the committed generated code (go.mod / sqlc headers).
  TEMPL_VERSION: v0.3.1070
  SQLC_VERSION: v1.31.1
  TAILWIND_VERSION: v4.3.3
  # The default `sherpa` build tag (audio transcription) links sherpa-onnx through cgo, so a C toolchain is
  # required; the hosted runners ship one (gcc, clang, mingw).
  CGO_ENABLED: "1"

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    # The macOS legs have not run on a real Mac yet: their failure must not block the Linux and
    # Windows release. A failed leg stays visible as a red job and its installer is simply absent.
    continue-on-error: ${{ startsWith(matrix.name, 'macos') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-22.04 # oldest hosted runner: keeps the AppImage (Electron) glibc requirement low
            tailwind: tailwindcss-linux-x64
            tailwind_sha256: dc61b3ac6b8c9ca874c0cc4c57b2409791a64c5540404ca5f5367360babc313a
            bin: iworkflow
            archive: tar.gz
            installer: AppImage
            update_meta: server-dist/electron/latest-linux.yml
          - name: windows-x86_64
            os: windows-latest
            bin: iworkflow.exe
            archive: zip
            installer: exe
            update_meta: server-dist/electron/latest.yml
            tailwind: tailwindcss-windows-x64.exe
            tailwind_sha256: e0e260ce048014e9268f6237ff18f8ccf02cef521cbd0ae04e82c2cdf7aa3955
          - name: macos-arm64
            os: macos-latest
            tailwind: tailwindcss-macos-arm64
            tailwind_sha256: cdf646702987a743464dff4d9c60fd4480d1c1e73dd819a9a67f1078815dce9d
            bin: iworkflow
            archive: tar.gz
            installer: dmg
          - name: macos-x86_64
            os: macos-15-intel
            tailwind: tailwindcss-macos-x64
            tailwind_sha256: 7922e0953f2110c05976e3bf58f14e643d90427575e766b7d433f5f80cbee7e1
            bin: iworkflow
            archive: tar.gz
            installer: dmg
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # The tag is the release; electron/package.json (make bump-version) feeds the installer and the binary.
      - name: Check tag matches app version
        if: github.ref_type == 'tag'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          PKG="$(node -p "require('./electron/package.json').version")"
          if [ "$TAG" != "v$PKG" ]; then
            echo "Tag $TAG does not match electron/package.json version $PKG; run 'make bump-version VERSION=${TAG#v}' and retag." >&2
            exit 1
          fi

      - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Install code generators
        run: |
          set -euo pipefail
          go install "github.com/a-h/templ/cmd/templ@${TEMPL_VERSION}"
          go install "github.com/sqlc-dev/sqlc/cmd/sqlc@${SQLC_VERSION}"
          # Tailwind standalone CLI (no Node needed for the CSS build), exposed as `tailwindcss`.
          # The expected SHA-256 is pinned per asset in the matrix; bump both with TAILWIND_VERSION.
          BIN_DIR="$HOME/.local/bin"
          GO_BIN_DIR="$(go env GOPATH)/bin"
          mkdir -p "$BIN_DIR"
          EXT=""
          if [ "${{ runner.os }}" = "Windows" ]; then EXT=".exe"; fi
          curl -fsSL -o "$BIN_DIR/tailwindcss$EXT" \
            "https://github.com/tailwindlabs/tailwindcss/releases/download/${TAILWIND_VERSION}/${{ matrix.tailwind }}"
          if command -v sha256sum >/dev/null; then
            ACTUAL="$(sha256sum "$BIN_DIR/tailwindcss$EXT" | cut -d' ' -f1)"
          else
            ACTUAL="$(shasum -a 256 "$BIN_DIR/tailwindcss$EXT" | cut -d' ' -f1)"
          fi
          if [ "$ACTUAL" != "${{ matrix.tailwind_sha256 }}" ]; then
            echo "Tailwind checksum mismatch for ${{ matrix.tailwind }}: got $ACTUAL" >&2
            exit 1
          fi
          chmod +x "$BIN_DIR/tailwindcss$EXT"
          # $GITHUB_PATH takes native paths: Git Bash POSIX paths (/c/Users/...) would not resolve on Windows.
          if [ "${{ runner.os }}" = "Windows" ]; then
            BIN_DIR="$(cygpath -w "$BIN_DIR")"
            GO_BIN_DIR="$(cygpath -w "$GO_BIN_DIR")"
          fi
          echo "$BIN_DIR" >> "$GITHUB_PATH"
          echo "$GO_BIN_DIR" >> "$GITHUB_PATH"

      # `make dist` needs GNU make; the Windows runner may not ship it.
      - name: Ensure make
        run: command -v make >/dev/null || choco install make -y --no-progress

      # templ + sqlc + tailwind, then go build into $DIST_DIR with its site/.
      - name: Build (release)
        run: make dist DIST_DIR="$PWD/server-dist"

      # The packaged server must at least start and exit 0; --help does not bind a port or touch the DB.
      - name: Smoke test binary
        run: ./server-dist/${{ matrix.bin }} --help

      - name: Package
        id: package
        env:
          # Passed through the environment, never interpolated into the script.
          REF_LABEL: ${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
        run: |
          set -euo pipefail
          NAME="iworkflow-${REF_LABEL}-${{ matrix.name }}"
          mkdir -p "dist/$NAME"
          cp "server-dist/${{ matrix.bin }}" "dist/$NAME/"
          cp -r server-dist/site "dist/$NAME/site"
          cd dist
          if [ "${{ matrix.archive }}" = "zip" ]; then
            7z a -tzip "$NAME.zip" "$NAME" > /dev/null
            echo "file=dist/$NAME.zip" >> "$GITHUB_OUTPUT"
          else
            tar -czf "$NAME.tar.gz" "$NAME"
            echo "file=dist/$NAME.tar.gz" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: iworkflow-${{ matrix.name }}
          path: ${{ steps.package.outputs.file }}
          if-no-files-found: error

      # Desktop installer (Electron) wrapping the server built above. See the electron-build target of the Makefile.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: electron/package-lock.json

      - name: Test desktop launcher
        run: npm ci && npm test
        working-directory: electron

      - name: Build desktop installer
        id: installer
        run: |
          set -euo pipefail
          make electron-build DIST_DIR="$PWD/server-dist" SKIP_SERVER_BUILD=1
          echo "glob=server-dist/electron/iworkflow-*.${{ matrix.installer }}*" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: iworkflow-desktop-${{ matrix.name }}
          # latest*.yml (+ .blockmap) feed electron-updater. macOS has none: it only notifies.
          path: |
            ${{ steps.installer.outputs.glob }}
            ${{ matrix.update_meta }}
          if-no-files-found: error

  release:
    name: Publish release
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: artifacts/*
          generate_release_notes: true
          # electron-updater resolves /releases/latest, which GitHub only serves for a non-prerelease.
          prerelease: false
          make_latest: true
