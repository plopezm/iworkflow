name: Build binaries

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-22.04 # oldest hosted runner: keeps the glibc requirement low
            bin: iworkflow
            archive: tar.gz
            installer: AppImage
          - name: windows-x86_64
            os: windows-latest
            bin: iworkflow.exe
            archive: zip
            installer: exe
            # Statically link the MSVC runtime so no VC++ redistributable is needed.
            # Scoped to the host target so the wasm build is unaffected.
            rustflags: "-C target-feature=+crt-static"
          - name: macos-arm64
            os: macos-latest
            bin: iworkflow
            archive: tar.gz
            installer: dmg
          - name: macos-x86_64
            os: macos-15-intel
            bin: iworkflow
            archive: tar.gz
            installer: dmg
    env:
      CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: ${{ matrix.rustflags }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: ${{ matrix.name }}

      - name: Install cargo-leptos
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2
        with:
          tool: cargo-leptos

      # Same steps as `scripts/prod.sh build`.
      - name: Build (release)
        run: cargo leptos build --release

      - name: Package
        id: package
        env:
          # Passed through the environment, never interpolated into the script.
          REF_LABEL: ${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
        run: |
          set -euo pipefail
          NAME="iworkflow-${REF_LABEL}-${{ matrix.name }}"
          mkdir -p "dist/$NAME"
          cp "target/release/${{ matrix.bin }}" "dist/$NAME/"
          cp -r target/site "dist/$NAME/site"
          cd dist
          if [ "${{ matrix.archive }}" = "zip" ]; then
            7z a -tzip "$NAME.zip" "$NAME" > /dev/null
            echo "file=dist/$NAME.zip" >> "$GITHUB_OUTPUT"
          else
            tar -czf "$NAME.tar.gz" "$NAME"
            echo "file=dist/$NAME.tar.gz" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: iworkflow-${{ matrix.name }}
          path: ${{ steps.package.outputs.file }}
          if-no-files-found: error

      # Desktop installer (Electron) wrapping the server built above. See scripts/electron.sh.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: electron/package-lock.json

      - name: Test desktop launcher
        run: npm ci && npm test
        working-directory: electron

      - name: Build desktop installer
        id: installer
        run: |
          set -euo pipefail
          mkdir -p server-dist
          cp "target/release/${{ matrix.bin }}" server-dist/
          cp -r target/site server-dist/site
          DIST_DIR="$PWD/server-dist" SKIP_SERVER_BUILD=1 ./scripts/electron.sh build
          echo "glob=server-dist/electron/iworkflow-*.${{ matrix.installer }}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: iworkflow-desktop-${{ matrix.name }}
          path: ${{ steps.installer.outputs.glob }}
          if-no-files-found: error

  release:
    name: Publish release
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: artifacts/*
          generate_release_notes: true
